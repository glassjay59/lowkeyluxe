<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lowkey Luxe</title>
<meta name="description" content="Lowkey Luxe: nice things for less. Verified deals on beauty, tech, clothes, sneakers, groceries, food and freebies, checked twice a day.">
<meta name="theme-color" content="#1C1820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lowkey Luxe">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: phone-app shell — sticky charcoal app bar + scrolling category chips, a feed of tappable deal rows, fixed bottom tab bar, bottom-sheet checker. Charcoal + hot pink, one look in every theme. */
:root{
  --bg:#F5F3F6; --surface:#FFFFFF; --ink:#1C1820; --muted:#6E6475; --line:#E6E1EA;
  --accent:#E0337F; --accent-2:#FF4FA0; --accent-ink:#FFFFFF; --accent-soft:#FFE3F0; --field:#F9F7FA; --char:#1C1820; --char-2:#2D2633;
  --ok:#C2186B; --bad:#C0164F; --bad-soft:#FFDDE8;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --tabh:64px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);overscroll-behavior-y:contain}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* App bar */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--char-2),var(--char));color:#fff;padding-top:env(safe-area-inset-top,0px);box-shadow:0 4px 18px rgba(28,24,32,.25)}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px 8px}
.logo{width:36px;height:36px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.18);flex:none}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;margin:0;letter-spacing:-.02em}
.brand small{display:block;font-size:11.5px;opacity:.7;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newpill{background:var(--accent-2);color:#fff;font-weight:800;font-size:12px;padding:4px 10px;border-radius:99px;white-space:nowrap}
.search{position:relative;padding-bottom:10px}
.search input{width:100%;border:0;border-radius:12px;padding:10px 12px 10px 36px;font:inherit;font-size:15px;background:rgba(255,255,255,.1);color:#fff}
.search input::placeholder{color:rgba(255,255,255,.6)!important}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:11px;top:11px;width:17px;height:17px;color:rgba(255,255,255,.6)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.9);padding:6px 12px;border-radius:99px;font-weight:700;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-2);color:#fff;border-color:var(--accent-2)}

/* Install hint */
.hint{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;font-size:14px}
.hint img{width:40px;height:40px;border-radius:10px;flex:none}
.hint p{margin:0;flex:1}
.hint button{color:var(--muted);font-size:20px;line-height:1;padding:4px}

/* Feed */
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:14px 8px}
.meta h2{font-family:var(--f-display);font-size:20px;margin:0}
.meta .count{color:var(--muted);font-size:13px;font-weight:600}
select{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 8px;border-radius:10px}
.feed{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:720px){.feed{grid-template-columns:1fr 1fr}}
@media (min-width:1040px){.feed{grid-template-columns:1fr 1fr 1fr}}
.empty{grid-column:1/-1;border:2px dashed var(--line);border-radius:16px;padding:32px 16px;text-align:center;color:var(--muted);background:var(--surface)}

.deal{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.deal.isnew{border-color:var(--accent-2);box-shadow:0 0 0 1px var(--accent-2)}
.go{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px;align-items:start}
.go:active{background:var(--accent-soft)}
.pic{width:96px;height:96px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative}
.pic img{width:100%;height:100%;object-fit:contain;padding:6px}
.pic img.cover{object-fit:cover;padding:0}
.pic img.logo{width:52px;height:52px;padding:0}
.pic .emoji{font-size:40px}
.body{min-width:0;display:grid;gap:4px}
.row1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}
.store{font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pill{padding:1px 7px;border-radius:99px;font-weight:800;font-size:10.5px;white-space:nowrap}
.p-new{background:var(--accent);color:#fff}
.p-local{background:var(--accent-soft);color:var(--ok)}
.p-stack{background:var(--char);color:#fff}
.p-free{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.title{font-weight:700;font-size:15px;line-height:1.25;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;font-family:var(--f-mono)}
.price .now{font-size:19px;font-weight:500;color:var(--accent)}
.price .was{color:var(--muted);text-decoration:line-through;font-size:12px}
.price .off{background:var(--accent-soft);color:var(--ok);font-size:11px;padding:1px 6px;border-radius:6px}
.ends{font-size:12px;color:var(--muted)}
.ends .soon{color:var(--bad);font-weight:700}
.actions{display:flex;align-items:center;gap:6px;border-top:1px dashed var(--line);padding:8px 12px}
.act{font-weight:700;font-size:13px;color:var(--muted);padding:6px 8px;border-radius:8px}
.act.how[aria-expanded="true"]{color:var(--accent)}
.act.save[aria-pressed="true"]{color:var(--accent)}
.act.open{margin-left:auto;background:var(--char);color:#fff;padding:7px 14px;border-radius:99px}
.steps{margin:0;padding:0 16px 12px 32px;font-size:14px;display:grid;gap:4px}
.steps li::marker{color:var(--accent);font-weight:700}
.steps .src{list-style:none;margin-left:-16px;color:var(--muted);font-size:12.5px}
.steps .src a{color:var(--accent);text-decoration:underline}
.more{grid-column:1/-1;height:1px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="true"]{color:var(--accent)}
.tab .dot{position:absolute;margin-left:22px;margin-top:-22px;min-width:16px;height:16px;border-radius:99px;background:var(--accent);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.tab{position:relative}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(28,24,32,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto;display:grid;gap:10px;box-shadow:0 -10px 30px rgba(28,24,32,.25)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);justify-self:center}
.sheet h3{font-family:var(--f-display);font-size:22px;margin:4px 0 0}
.sheet p{margin:0;color:var(--muted);font-size:14px}
label{font-weight:700;font-size:13px}
textarea,input[type=url]{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--field);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.btnrow{display:flex;gap:8px}
.btn{flex:1;text-align:center;border:1px solid var(--line);padding:11px 14px;border-radius:12px;font-weight:800;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--char);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:50;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <img class="logo" src="icon-192.png" alt="">
      <div class="brand"><h1>Lowkey <span style="color:var(--accent-2)">Luxe</span></h1><small id="lastScan">Loading deals…</small></div>
      <span class="newpill" id="newFlag" hidden></span>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search deals, stores, items…" autocomplete="off" enterkeyhint="search" aria-label="Search deals">
    </div>
    <div class="chips" id="chips" role="toolbar" aria-label="Categories"></div>
  </div>
</header>

<main class="wrap">
  <div class="hint" id="hint" hidden>
    <img src="icon-192.png" alt="">
    <p id="hintText">Add Lowkey Luxe to your Home Screen: tap <b>Share</b>, then <b>Add to Home Screen</b>.</p>
    <button id="hintX" aria-label="Dismiss">×</button>
  </div>
  <div class="meta"><div><h2 id="viewTitle">All deals</h2><span class="count" id="count"></span></div>
    <select id="sortSel" aria-label="Sort"><option value="new">Newest</option><option value="ending">Ending soon</option><option value="save">Biggest % off</option><option value="cheap">Lowest price</option></select>
  </div>
  <section class="feed" id="feed" aria-live="polite"><div class="empty">Loading deals…</div></section>
</main>

<div class="tabs"><nav aria-label="Main">
  <button class="tab" data-tab="all" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12 12 3h8a1 1 0 0 1 1 1v8l-9 9-9-9Z"/><circle cx="16.5" cy="7.5" r="1.5" fill="currentColor"/></svg>Deals</button>
  <button class="tab" data-tab="local"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Knoxville</button>
  <button class="tab" data-tab="free"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v8h14v-8M12 8v13M12 8S10.5 3 8 3.5 7 8 12 8Zm0 0s1.5-5 4-4.5S17 8 12 8Z"/></svg>Free</button>
  <button class="tab" data-tab="got"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-9-9.3C1.9 7 4.3 4 7.4 4c2 0 3.5 1.2 4.6 2.7C13.1 5.2 14.6 4 16.6 4c3.1 0 5.5 3 4.4 6.7-1.5 4.7-9 9.3-9 9.3Z"/></svg>Saved</button>
  <button class="tab" data-tab="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.5 2.5L16 9.5"/></svg>Check</button>
</nav></div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grab"></div>
  <h3 id="sheetTitle">Check a deal</h3>
  <p>Saw a deal on TikTok, Facebook or in an app? Send it over and it gets tested on the next web scan.</p>
  <label for="ckText">The deal</label>
  <textarea id="ckText" placeholder="e.g. Kroger: buy 5 Cheerios in the Mega Sale + $1/2 digital coupon = $1.49 each?"></textarea>
  <label for="ckUrl">Link (optional)</label>
  <input type="url" id="ckUrl" placeholder="https://">
  <div class="btnrow"><a class="btn primary" id="ckSend" href="#">Text it to Jay</a><button class="btn" id="ckCopy" type="button">Copy</button></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const CATS=[{id:"all",label:"All"},{id:"new",label:"New today"},{id:"grocery",label:"Kroger & grocery"},{id:"bathbody",label:"Bath & Body Works"},{id:"beauty",label:"Makeup & beauty"},{id:"electronics",label:"Electronics"},{id:"fashion",label:"Clothes & shoes"},{id:"food",label:"Food"},{id:"fun",label:"Things to do"},{id:"everyday",label:"Target & everyday"}];
const TITLES={all:"All deals",new:"New today",grocery:"Kroger & grocery",bathbody:"Bath & Body Works",beauty:"Makeup & beauty",electronics:"Electronics",fashion:"Clothes & shoes",food:"Food & restaurants",fun:"Things to do",everyday:"Target & everyday",local:"Around Knoxville",free:"Freebies",got:"Saved deals"};
const ART={grocery:"🛒",bathbody:"🕯️",beauty:"💄",electronics:"🎧",fashion:"👟",food:"🍔",fun:"🎟️",free:"🎁",everyday:"🎯"};
const PAGE=30;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>typeof n==="number"?(n===0?"FREE":"$"+n.toFixed(2).replace(/\.00$/,"")):"";
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let state={cat:"all",tab:"all",sort:store.get("tt-sort","new"),q:"",deals:[],got:new Set(store.get("tt-got",[])),shown:PAGE,list:[]};
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200)}
function daysLeft(exp){if(!exp)return null;const[y,m,d]=exp.split("-").map(Number);return Math.ceil((new Date(y,m-1,d,23,59,59)-new Date())/864e5)}
const isNew=d=>d.addedAt&&(Date.now()-new Date(d.addedAt).getTime())<36*3600e3;
const live=d=>d.status!=="dead"&&!((daysLeft(d.expires)??0)<0);
const isFree=d=>d.category==="free"||d.price===0||/^free/i.test(d.priceText||"");
const pctOff=d=>(typeof d.price==="number"&&typeof d.was==="number"&&d.was>0)?Math.round((1-d.price/d.was)*100):(d.pctOff||0);
function ago(iso){if(!iso)return"";const h=(Date.now()-new Date(iso).getTime())/36e5;if(h<1)return"just now";if(h<24)return Math.round(h)+"h ago";return Math.round(h/24)+"d ago"}
/* Where a tap goes: the deal's own page; a bare store homepage falls back to the article that explains the deal. */
function dealLink(d){
  let u=d.url||"";
  try{const p=new URL(u);if((p.pathname==="/"||p.pathname==="")&&!p.search&&d.source)u=d.source}catch(e){u=d.source||""}
  return u;
}
function base(){
  if(state.tab==="got")return state.deals.filter(d=>state.got.has(d.id));
  let l=state.deals.filter(live);
  if(state.tab==="local")l=l.filter(d=>d.local);
  else if(state.tab==="free")l=l.filter(isFree);
  if(state.cat==="new")l=l.filter(isNew);
  else if(state.cat!=="all")l=l.filter(d=>d.category===state.cat);
  if(state.q){const words=state.q.toLowerCase().split(/\s+/).filter(Boolean);l=l.filter(d=>{const t=[d.title,d.store,d.area,d.where,d.note].join(" ").toLowerCase();return words.every(w=>t.includes(w))})}
  return l;
}
function renderChips(){
  $("chips").innerHTML=CATS.map(c=>`<button class="chip" data-cat="${c.id}" aria-pressed="${state.cat===c.id}">${esc(c.label)}</button>`).join("");
}
function pic(d){
  const logo=d.storeDomain?`https://www.google.com/s2/favicons?domain=${encodeURIComponent(d.storeDomain)}&sz=128`:"";
  const first=d.image||logo;
  const cls=d.image?((d.category==="food"||d.category==="fun")&&d.photo!=="product"?"cover":""):"logo";
  return first?`<img src="${esc(first)}" alt="" class="${cls}" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-logo="${esc(d.image?logo:"")}" data-cat="${esc(d.category)}" onerror="picFail(this)">`
    :`<span class="emoji" aria-hidden="true">${ART[d.category]||"🏷️"}</span>`;
}
function picFail(img){
  const logo=img.dataset.logo;
  if(logo){img.dataset.logo="";img.className="logo";img.src=logo;return}
  const s=document.createElement("span");s.className="emoji";s.setAttribute("aria-hidden","true");s.textContent=ART[img.dataset.cat]||"🏷️";img.replaceWith(s);
}
function card(d){
  const dl=daysLeft(d.expires),off=pctOff(d),got=state.got.has(d.id),link=dealLink(d);
  const ends=dl===null?(d.verifiedAt?`Checked ${esc(ago(d.verifiedAt))}`:""):dl<0?"Ended":dl===0?`<span class="soon">Ends today</span>`:dl===1?`<span class="soon">Ends tomorrow</span>`:dl<=7?`Ends in ${dl} days`:`Ends ${esc(new Date(d.expires+"T12:00").toLocaleDateString([], {month:"short",day:"numeric"}))}`;
  const steps=(d.steps||[]).map(s=>`<li>${esc(s)}</li>`).join("")+(d.note?`<li>${esc(d.note)}</li>`:"")+(d.source?`<li class="src">Found on <a href="${esc(d.source)}" target="_blank" rel="noopener">${esc(d.sourceName||"source")}</a></li>`:"");
  const priceNow=d.priceText||money(d.price);
  const tag=link?"a":"div", attrs=link?`href="${esc(link)}" target="_blank" rel="noopener"`:"";
  return `<article class="deal ${isNew(d)?"isnew":""}">
    <${tag} class="go" ${attrs}>
      <div class="pic">${pic(d)}</div>
      <div class="body">
        <div class="row1"><span class="store">${esc(d.store)}</span>${isNew(d)?`<span class="pill p-new">NEW</span>`:""}${d.local?`<span class="pill p-local">📍 ${esc(d.area||"Knoxville")}</span>`:""}${d.combo?`<span class="pill p-stack">Stack</span>`:""}</div>
        <h3 class="title">${esc(d.title)}</h3>
        <div class="price">${priceNow?`<span class="now">${esc(priceNow)}</span>`:""}${d.was?`<span class="was">${esc(money(d.was))}</span>`:""}${off>0?`<span class="off">${off}% off</span>`:""}</div>
        ${ends?`<div class="ends">${ends}${d.where?` · ${esc(d.where)}`:""}</div>`:(d.where?`<div class="ends">${esc(d.where)}</div>`:"")}
      </div>
    </${tag}>
    <div class="actions">
      ${steps?`<button class="act how" data-how="${esc(d.id)}" aria-expanded="false">How to get it</button>`:""}
      <button class="act save" data-got="${esc(d.id)}" aria-pressed="${got}">${got?"♥ Saved":"♡ Save"}</button>
      ${link?`<a class="act open" href="${esc(link)}" target="_blank" rel="noopener">Get deal ›</a>`:""}
    </div>
    ${steps?`<ol class="steps" id="how-${esc(d.id)}" hidden>${steps}</ol>`:""}
  </article>`;
}
function sortList(l){
  if(state.sort==="new")l.sort((a,b)=>(b.addedAt||"").localeCompare(a.addedAt||""));
  if(state.sort==="ending")l.sort((a,b)=>(daysLeft(a.expires)??999)-(daysLeft(b.expires)??999));
  if(state.sort==="save")l.sort((a,b)=>pctOff(b)-pctOff(a));
  if(state.sort==="cheap")l.sort((a,b)=>(typeof a.price==="number"?a.price:9e9)-(typeof b.price==="number"?b.price:9e9));
  return l;
}
let io;
function render(resetScroll){
  renderChips();
  state.list=sortList(base().slice());
  state.shown=PAGE;
  $("viewTitle").textContent=state.tab!=="all"?TITLES[state.tab]+(state.cat!=="all"?" · "+TITLES[state.cat]:""):TITLES[state.cat];
  $("count").textContent=state.list.length?` ${state.list.length} deal${state.list.length===1?"":"s"}`:"";
  paint();
  const n=state.deals.filter(d=>live(d)&&isNew(d)).length;
  $("newFlag").hidden=!n;$("newFlag").textContent=n+" new";
  if(resetScroll)window.scrollTo({top:0});
}
function paint(){
  const f=$("feed");
  if(!state.list.length){
    f.innerHTML=`<div class="empty">${state.tab==="got"?"Tap ♡ Save on a deal to keep it here.":state.q?"No deals match that search.":"Nothing here right now. Try another category."}</div>`;return;
  }
  f.innerHTML=state.list.slice(0,state.shown).map(card).join("")+(state.shown<state.list.length?`<div class="more" id="more"></div>`:"");
  const m=$("more");
  if(m){io?.disconnect();io=new IntersectionObserver(es=>{if(es[0].isIntersecting){state.shown+=PAGE;paint()}},{rootMargin:"600px"});io.observe(m)}
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(c){state.cat=c.dataset.cat;render(true);c.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});return}
  const t=e.target.closest(".tab");if(t){
    if(t.dataset.tab==="check"){openSheet();return}
    state.tab=t.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-current",x===t));render(true);return}
  const h=e.target.closest("[data-how]");if(h){const ol=$("how-"+h.dataset.how);const open=ol.hidden;ol.hidden=!open;h.setAttribute("aria-expanded",open);return}
  const g=e.target.closest("[data-got]");if(g){const id=g.dataset.got;state.got.has(id)?state.got.delete(id):state.got.add(id);store.set("tt-got",[...state.got]);const on=state.got.has(id);g.setAttribute("aria-pressed",on);g.textContent=on?"♥ Saved":"♡ Save";toast(on?"Saved":"Removed");if(state.tab==="got")render();return}
});
$("sortSel").value=state.sort;
$("sortSel").addEventListener("change",e=>{state.sort=e.target.value;store.set("tt-sort",state.sort);render(true)});
let qt;$("q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value.trim();render()},180)});

function openSheet(){$("scrim").hidden=false;$("sheet").hidden=false;setTimeout(()=>$("ckText").focus(),250)}
function closeSheet(){$("scrim").hidden=true;$("sheet").hidden=true}
$("scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function ckMsg(){const t=$("ckText").value.trim(),u=$("ckUrl").value.trim();return t?`Check this deal for Lowkey Luxe: ${t}${u?" "+u:""}`:""}
$("ckSend").addEventListener("click",e=>{const m=ckMsg();if(!m){e.preventDefault();$("ckText").focus();return toast("Type the deal first")}e.currentTarget.href="sms:?&body="+encodeURIComponent(m)});
$("ckCopy").addEventListener("click",async()=>{const m=ckMsg();if(!m)return toast("Type the deal first");try{await navigator.clipboard.writeText(m);toast("Copied")}catch(e){$("ckText").select();toast("Press copy on your keyboard")}});

/* Home Screen hint: only in a browser tab, not once installed. */
(function(){
  const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if(standalone||store.get("tt-hint-off",false))return;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(!ios)$("hintText").innerHTML="Add Lowkey Luxe to your Home Screen: open your browser menu (⋮), then <b>Add to Home screen</b>.";
  $("hint").hidden=false;
  $("hintX").addEventListener("click",()=>{$("hint").hidden=true;store.set("tt-hint-off",true)});
})();

let lastLoad=0;
function loadDeals(){
  lastLoad=Date.now();
  return fetch("deals.json?ts="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("load failed");return r.json()}).then(j=>{
    state.deals=j.deals||[];
    $("lastScan").textContent=j.lastScan?"Updated "+new Date(j.lastScan).toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"}):"Updated recently";
    render();
  }).catch(()=>{if(state.deals.length)return;$("feed").innerHTML=`<div class="empty">Couldn’t load deals. Check your connection and reopen the app.</div>`;$("lastScan").textContent="Offline"});
}
loadDeals();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-lastLoad>60000)loadDeals()});
window.addEventListener("pageshow",e=>{if(e.persisted)loadDeals()});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
